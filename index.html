<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <meta name="description" content="Bio link cá nhân — kết nối với tôi qua các nền tảng.">
  <title>Bio Link | [Điền tên của bạn]</title>

  <!-- Font Awesome CDN dùng cho các biểu tượng -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Nền trang trí -->
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Trang chủ">B.</a>

    <button
      class="icon-button theme-toggle"
      id="theme-toggle"
      type="button"
      aria-label="Chuyển sang giao diện sáng"
      title="Đổi giao diện"
    >
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
  </header>

  <main class="profile-card">
    <section class="profile" aria-labelledby="profile-name">
      <!-- Có thể thay phần chữ này bằng ảnh đại diện -->
      <div class="avatar" aria-hidden="true">
        <span>YN</span>
        <span class="avatar-status"></span>
      </div>

      <p class="eyebrow">
        <span class="status-dot" aria-hidden="true"></span>
        SẴN SÀNG KẾT NỐI
      </p>

      <h1 id="profile-name">[Điền tên của bạn]</h1>
      <p class="profile-role">[UI/UX Designer · Content Creator]</p>

      <p class="profile-bio" aria-label="Kiến tạo giá trị số thông qua thiết kế tối giản.">
        <span class="sr-only">Kiến tạo giá trị số thông qua thiết kế tối giản.</span>
        <span id="typing-text" aria-hidden="true">Kiến tạo giá trị số thông qua thiết kế tối giản.</span>
        <span class="typing-cursor" aria-hidden="true"></span>
      </p>
    </section>

    <nav class="link-list" aria-label="Các liên kết cá nhân">
      <!-- Thay href bằng đường dẫn thực tế của bạn -->
      <a class="link-card" href="https://example.com/portfolio" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></span>
        <span class="link-label">Portfolio / Sản phẩm</span>
        <i class="fa-solid fa-arrow-right link-arrow" aria-hidden="true"></i>
      </a>

      <a class="link-card" href="https://example.com/services" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-solid fa-sparkles" aria-hidden="true"></i></span>
        <span class="link-label">Khóa học / Dịch vụ</span>
        <i class="fa-solid fa-arrow-right link-arrow" aria-hidden="true"></i>
      </a>

      <a class="link-card" href="https://youtube.com/@your-channel" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-brands fa-youtube" aria-hidden="true"></i></span>
        <span class="link-label">Kênh YouTube</span>
        <i class="fa-solid fa-arrow-right link-arrow" aria-hidden="true"></i>
      </a>

      <a class="link-card" href="mailto:hello@example.com">
        <span class="link-icon"><i class="fa-regular fa-envelope" aria-hidden="true"></i></span>
        <span class="link-label">Liên hệ qua Email</span>
        <i class="fa-solid fa-arrow-right link-arrow" aria-hidden="true"></i>
      </a>
    </nav>

    <button class="share-button" id="share-button" type="button">
      <i class="fa-solid fa-link" aria-hidden="true"></i>
      <span>Chia sẻ trang</span>
    </button>

    <p class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <footer class="site-footer">
    <p>© <span id="current-year"></span> [Điền tên của bạn]. Made with care.</p>
  </footer>
</body>
</html>
